<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Task Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <div>
          <p class="eyebrow">DEVOPS PROJECT</p>
          <h1>Task Manager</h1>
          <p class="subtitle">A real Node.js + Express application ready for CI/CD.</p>
        </div>
        <span id="health" class="status">Checking...</span>
      </div>

      <form id="task-form">
        <input id="task-title" type="text" placeholder="Add a new task..." maxlength="120" required>
        <button type="submit">Add Task</button>
      </form>

      <div class="summary">
        <span id="task-count">0 tasks</span>
        <span id="completed-count">0 completed</span>
      </div>

      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
